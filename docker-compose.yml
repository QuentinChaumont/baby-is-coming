# Local end-to-end run of the production image (API + SPA in one container).
#   docker compose up --build      → app on http://localhost:8080
# Backend config comes from the shell / an optional root .env (see
# .env.example). Nothing secret is baked into an image.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - '8080:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      MONGO_URI: mongodb://mongo:27017/starter
      CORS_ORIGINS: http://localhost:8080
      AUTH_COOKIE_SECURE: 'false'
      # No proxy in front here. Behind an ingress (Traefik…) set TRUST_PROXY=1
      # so req.ip is the real client (rate limiting, audit, session IPs).
      # Override in .env / the shell for anything real.
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-for-production}
    env_file:
      - path: .env
        required: false
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
